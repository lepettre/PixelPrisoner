<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12151c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PixelPrisoner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PixelPrisoner</title>
  <link id="appleIcon" rel="apple-touch-icon" href="" />
  <link id="favicon" rel="icon" href="" />
  <style>
    :root{
      --bg:#12151c; --panel:#1c2430; --panel2:#273343; --ink:#eff6df; --muted:#a8b7a0;
      --lime:#b8d94b; --green:#5d7f3e; --dark:#10170f; --amber:#f0b95b; --danger:#d85d51;
      --screen:#c7d879; --screen2:#9bb45b; --safeTop:env(safe-area-inset-top); --safeBottom:env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;touch-action:manipulation}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    body{min-height:100svh;display:flex;justify-content:center;align-items:stretch}
    .app{width:min(100vw,520px);height:100svh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:var(--safeTop) max(10px,env(safe-area-inset-right)) var(--safeBottom) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 50% -10%,#263345 0,#12151c 52%)}
    header{padding:10px 0 8px;display:grid;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tab{border:1px solid #42536a;background:#1a222e;color:#c6d2bc;border-radius:12px;padding:9px 2px;font:700 10px/1 ui-monospace;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
    .tab.active{background:var(--lime);color:#14200f;border-color:#e8ff88}
    main{min-height:0;display:grid;place-items:center}.device{width:100%;display:grid;gap:12px}.screenFrame{position:relative;width:100%;aspect-ratio:9/14;max-height:calc(100dvh - 192px);min-height:360px;border-radius:34px;background:linear-gradient(145deg,#354258,#141923);padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.08)}
    .screenFrame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.09);border-radius:28px;pointer-events:none}.screenLabel{position:absolute;left:28px;right:28px;top:8px;display:flex;justify-content:space-between;color:#8c9a84;font-size:8px;letter-spacing:.14em;text-transform:uppercase}
    canvas{width:100%;height:100%;display:block;border-radius:22px;background:var(--screen);image-rendering:pixelated;box-shadow:inset 0 0 0 3px #111a12,inset 0 0 22px rgba(16,23,15,.55)}
    footer{padding:8px 0 max(10px,var(--safeBottom));display:grid;gap:9px}.hint{min-height:16px;text-align:center;color:#b6c8aa;font-size:10px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn{min-height:62px;border:0;border-radius:999px;background:linear-gradient(#e6f28f,#9fbe39);color:#17210f;font-family:inherit;font-weight:900;box-shadow:0 7px 0 #5d7427,0 12px 22px rgba(0,0,0,.35);display:grid;place-items:center;padding:8px}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #5d7427,0 5px 12px rgba(0,0,0,.35)}.btn span:first-child{font-size:24px;line-height:1}.btn span:last-child{font-size:10px;letter-spacing:.08em;text-transform:uppercase}.btn:nth-child(2){background:linear-gradient(#ffd27a,#df9941);box-shadow:0 7px 0 #8b5d22,0 12px 22px rgba(0,0,0,.35)}.btn:nth-child(3){background:linear-gradient(#f49a90,#ca504b);box-shadow:0 7px 0 #7b2e2b,0 12px 22px rgba(0,0,0,.35);color:#fff6ee}
    @media (orientation:landscape) and (max-height:520px){.app{grid-template-columns:1fr 240px;grid-template-rows:auto 1fr;padding:8px 10px}header{grid-column:1/3}.screenFrame{aspect-ratio:16/10;max-height:calc(100dvh - 78px);min-height:0}footer{align-self:end}.buttons{grid-template-columns:1fr}.btn{min-height:48px}.hint{white-space:normal}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top"><span>PixelPrisoner · WebApp</span><span id="clock">00:00</span></div>
      <nav class="tabs" aria-label="Kapitel">
        <button class="tab active" id="tab-3">Menü</button><button class="tab" id="tab-0">Gramsci</button><button class="tab" id="tab-1">Göring</button><button class="tab" id="tab-2">Epstein</button>
      </nav>
    </header>
    <main><section class="device"><div class="screenFrame"><div class="screenLabel"><span>Retina Cell</span><span>1 Bit Noir</span></div><canvas id="game" width="216" height="336"></canvas></div></section></main>
    <footer><div class="hint" id="hint">A: Modus wählen · B: starten · C: Reset</div><div class="buttons"><button class="btn" id="btnA"><span>A</span><span id="labA">Wahl</span></button><button class="btn" id="btnB"><span>B</span><span id="labB">Start</span></button><button class="btn" id="btnC"><span>C</span><span id="labC">Reset</span></button></div></footer>
  </div>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
const W=216,H=336, C={bg:'#c7d879',bg2:'#b2c96b',l:'#eff6df',m:'#9bb45b',d:'#5d7f3e',x:'#10170f',a:'#f0b95b',r:'#d85d51'};
let audioCtx, chapter=3, menu=0, popup=null, tick=0;
const SGV=8*3600,SGL=6*3600,SGP=336*3600,SEL=4*3600,SEE=6*3600,SES=72*3600;
let gramsci={hunger:100,paper:80,health:100,progress:0,notebooks:0,isDead:false,firstStart:true};
let nuremberg={progressTimer:0,lightTimer:SGL,cyanide:0,isDark:false,isDead:false,isWon:false,firstStart:true};
let epstein={logTimer:SEL,energy:100,danger:10,shiftTimer:SES,shiftsCompleted:0,isSleeping:false,isSurfing:false,isSuspended:false,isFinished:false,firstStart:true};
function icon(){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=180;x.fillStyle='#12151c';x.fillRect(0,0,180,180);x.fillStyle='#b8d94b';x.fillRect(24,24,132,132);x.fillStyle='#10170f';x.fillRect(42,42,96,96);x.fillStyle='#eff6df';x.fillRect(60,60,18,18);x.fillRect(102,60,18,18);x.fillStyle='#5d7f3e';x.fillRect(60,108,60,12);const u=c.toDataURL('image/png');$('appleIcon').href=u;$('favicon').href=u} icon();
function initAudio(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume()} function beep(f=440,d=.06){try{initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.055,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function save(){try{localStorage.setItem('pp_v3',JSON.stringify({time:Date.now(),gramsci,nuremberg,epstein,chapter}))}catch(e){}} function load(){try{let r=localStorage.getItem('pp_v3')||localStorage.getItem('pixelprisoner_save_v2'); if(!r)return; let d=JSON.parse(r),e=Math.min((Date.now()-(d.time||Date.now()))/1000,30*86400); if(d.gramsci)gramsci=d.gramsci;if(d.nuremberg)nuremberg=d.nuremberg;if(d.epstein)epstein=d.epstein;if(d.chapter!==undefined)chapter=d.chapter; if(d.currentChapter!==undefined)chapter=d.currentChapter; simulate(e)}catch(e){}}
function simulate(s){let steps=Math.min(360,Math.ceil(s/60)),dt=s/steps||0; for(let i=0;i<steps;i++)logic(dt,false)}
function fmt(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'h '+m+'m'}
function setChapter(i){chapter=i;popup=null;beep(620);[0,1,2,3].forEach(n=>$('tab-'+n).classList.toggle('active',n===i)); if(i===0&&gramsci.firstStart)intro(0); if(i===1&&nuremberg.firstStart)intro(1); if(i===2&&epstein.firstStart)intro(2); labels(); save()}
[0,1,2,3].forEach(n=>$('tab-'+n).onclick=()=>setChapter(n)); ['A','B','C'].forEach(k=>$('btn'+k).onclick=()=>press(k));
function intro(i){popup=i===0?['CELL MATE: GRAMSCI','8 STUNDEN VERFALL','ZIEL: HEFTE SCHREIBEN','A SUPPE · B PAPIER · C MEDIZIN','A STARTET']:i===1?['NUREMBERG: GOERING','LICHT ALLE 6 STUNDEN','14 TAGE PROZESS','A LICHT · B FILZEN · C VERHOER','A STARTET']:['29 MIN LATER','LOG ALLE 4 STUNDEN','SCHICHTEN ALLE 72H','A SURFEN · B SCHLAF · C LOG','A STARTET']}
function labels(){let a='Wahl',b='Start',c='Reset',h='A: Modus wählen · B: starten · C: Reset'; if(chapter===0){a='Suppe';b='Papier';c='Medizin';h='A: Hunger · B: Papier · C: Gesundheit'} if(chapter===1){a='Licht';b='Filzen';c='Verhör';h='A: Licht · B: Zelle filzen · C: Prozess beschleunigen'} if(chapter===2){a='Surfen';b='Schlaf';c='Logbuch';h='A: Surfen · B: Schlaf an/aus · C: Logbuch'} $('labA').textContent=a;$('labB').textContent=b;$('labC').textContent=c;$('hint').textContent=h}
function press(k){beep(k==='A'?390:k==='B'?510:650); if(popup){if(k==='A'){popup=null;if(chapter===0)gramsci.firstStart=false;if(chapter===1)nuremberg.firstStart=false;if(chapter===2)epstein.firstStart=false;save()}return} if(chapter===3){if(k==='A')menu=(menu+1)%3; if(k==='B')setChapter(menu); if(k==='C'){try{localStorage.removeItem('pp_v3');localStorage.removeItem('pixelprisoner_save_v2')}catch(e){} location.reload()} } else if(chapter===0){if(gramsci.isDead)resetG(); else if(k==='A')gramsci.hunger=Math.min(100,gramsci.hunger+30); else if(k==='B')gramsci.paper=Math.min(100,gramsci.paper+35); else gramsci.health=Math.min(100,gramsci.health+25)} else if(chapter===1){if(nuremberg.isDead||nuremberg.isWon)resetN(); else if(k==='A'){nuremberg.lightTimer=SGL;nuremberg.isDark=false} else if(k==='B')nuremberg.cyanide=Math.max(0,nuremberg.cyanide-30); else {nuremberg.progressTimer=Math.min(SGP,nuremberg.progressTimer+21600);nuremberg.cyanide=Math.min(100,nuremberg.cyanide+10)}} else {if(epstein.isSuspended||epstein.isFinished)resetE(); else if(k==='A'){epstein.isSurfing=true;epstein.isSleeping=false;epstein.danger=Math.min(100,epstein.danger+10)} else if(k==='B'){epstein.isSleeping=!epstein.isSleeping;epstein.isSurfing=false} else {epstein.logTimer=SEL;epstein.isSleeping=false;epstein.isSurfing=false;epstein.danger=Math.max(0,epstein.danger-10)}} save()}
function resetG(){gramsci={hunger:100,paper:80,health:100,progress:0,notebooks:0,isDead:false,firstStart:false}} function resetN(){nuremberg={progressTimer:0,lightTimer:SGL,cyanide:0,isDark:false,isDead:false,isWon:false,firstStart:false}} function resetE(){epstein={logTimer:SEL,energy:100,danger:10,shiftTimer:SES,shiftsCompleted:0,isSleeping:false,isSurfing:false,isSuspended:false,isFinished:false}}
function logic(dt=1/30,real=true){tick++; if(chapter===0&&!gramsci.isDead&&!gramsci.firstStart){gramsci.hunger=Math.max(0,gramsci.hunger-(100/SGV)*dt);gramsci.health=Math.max(0,gramsci.health-(50/SGV)*dt);gramsci.paper=Math.max(0,gramsci.paper-(40/SGV)*dt); if(gramsci.paper>10){gramsci.progress+=(5/3600)*dt;if(gramsci.progress>=100){gramsci.progress-=100;gramsci.notebooks++}} if(gramsci.hunger<=0||gramsci.health<=0)gramsci.isDead=true} if(chapter===1&&!nuremberg.isDead&&!nuremberg.isWon&&!nuremberg.firstStart){nuremberg.lightTimer=Math.max(0,nuremberg.lightTimer-dt); if(nuremberg.lightTimer<=0){nuremberg.isDark=true;nuremberg.cyanide=Math.min(100,nuremberg.cyanide+(15/3600)*dt)} if(!nuremberg.isDark)nuremberg.progressTimer=Math.min(SGP,nuremberg.progressTimer+dt); if(nuremberg.cyanide>=100)nuremberg.isDead=true;if(nuremberg.progressTimer>=SGP)nuremberg.isWon=true} if(chapter===2&&!epstein.isSuspended&&!epstein.isFinished&&!epstein.firstStart){epstein.logTimer=Math.max(0,epstein.logTimer-dt); if(epstein.isSleeping){epstein.energy=Math.min(100,epstein.energy+(50/3600)*dt);epstein.danger=Math.min(100,epstein.danger+(20/3600)*dt)}else{epstein.energy=Math.max(0,epstein.energy-(100/SEE)*dt);epstein.danger=Math.min(100,epstein.danger+(5/3600)*dt)} if(epstein.logTimer<=0||epstein.energy<=0)epstein.isSuspended=true;if(epstein.danger>=100)epstein.isFinished=true; epstein.shiftTimer=Math.max(0,epstein.shiftTimer-dt); if(epstein.shiftTimer<=0){epstein.shiftsCompleted++;epstein.shiftTimer=SES}} if(real&&tick%180===0)save()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))} function text(t,x,y,s=9,c=C.x,a='left'){ctx.fillStyle=c;ctx.font='700 '+s+'px ui-monospace,monospace';ctx.textAlign=a;ctx.fillText(t,x,y);ctx.textAlign='left'} function bar(x,y,w,v,label){rect(x,y,w,8,C.d);rect(x+1,y+1,Math.max(0,(w-2)*v/100),6,v<25?C.r:C.l);text(label,x,y-2,7,C.x)}
function face(cx,cy,kind){let bob=Math.sin(tick/16)*2; rect(cx-30,cy-26+bob,60,68,C.d); rect(cx-24,cy-18+bob,48,42,C.l); rect(cx-18,cy-30+bob,36,14,C.x); rect(cx-16,cy-4+bob,8,7,C.x); rect(cx+8,cy-4+bob,8,7,C.x); rect(cx-4,cy+5+bob,8,4,C.d); if(kind===0){rect(cx-18,cy+17+bob,36,5,C.x);rect(cx-32,cy+42+bob,64,40,C.x);rect(cx-26,cy+46+bob,52,22,C.d);rect(cx+22,cy-16+bob,18,46,C.x)} if(kind===1){rect(cx-24,cy-24+bob,48,12,C.x);rect(cx-28,cy+13+bob,56,7,C.x);rect(cx-36,cy+42+bob,72,38,C.d);rect(cx-8,cy+48+bob,16,32,C.a)} if(kind===2){rect(cx-20,cy-22+bob,40,10,C.x);rect(cx-14,cy+16+bob,28,4,C.x);rect(cx-30,cy+42+bob,60,38,C.d);rect(cx-22,cy+50+bob,44,12,C.l)}}
function roomBase(){rect(0,0,W,H,C.bg);for(let y=0;y<H;y+=12){rect(0,y,W,1,C.bg2)}for(let x=0;x<W;x+=24){rect(x,0,1,H,C.bg2)}}
function draw(){roomBase(); if(chapter===3){text('PIXEL PRISONER',W/2,48,18,C.x,'center');text('Drei Timer-Geschichten für den Homescreen',W/2,68,8,C.d,'center');let o=['CELL MATE · GRAMSCI','NUREMBERG · GOERING','29 MIN LATER · EPSTEIN']; for(let i=0;i<3;i++){let y=102+i*54;rect(20,y,176,38,i===menu?C.x:C.d);rect(24,y+4,168,30,i===menu?C.l:C.bg);text((i===menu?'> ':'  ')+o[i],32,y+25,10,i===menu?C.x:C.l)} face(108,258,menu)}
else if(chapter===0){for(let x=18;x<W;x+=34)rect(x,32,10,52,C.x);rect(0,256,W,80,C.d);rect(28,214,100,18,C.x);rect(36,232,12,66,C.x);rect(110,232,12,66,C.x);face(80,154,0);text('HEFTE '+gramsci.notebooks,136,50,10);bar(136,78,62,gramsci.hunger,'Hunger');bar(136,106,62,gramsci.paper,'Papier');bar(136,134,62,gramsci.health,'Gesund');bar(136,162,62,gramsci.progress,'Heft'); if(gramsci.isDead)modal(['GRAMSCI GESTORBEN','Taste druecken: Neustart'])}
else if(chapter===1){rect(0,0,W,H,C.x); if(!nuremberg.isDark){ctx.fillStyle=C.l;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,120);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle=C.bg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(170,H);ctx.lineTo(0,H);ctx.fill()} rect(0,256,W,80,C.d);rect(25,54,166,92,C.m);for(let x=35;x<190;x+=24)rect(x,54,8,92,C.x);face(108,171,1);text('PROZESS '+Math.floor(nuremberg.progressTimer/SGP*100)+'%',18,30,10,nuremberg.isDark?C.l:C.x);text('GIFT '+Math.floor(nuremberg.cyanide)+'%',18,48,10,nuremberg.isDark?C.r:C.x);text('LICHT '+fmt(nuremberg.lightTimer),18,316,10,C.l); if(nuremberg.isDead)modal(['SUIZID IN ZELLE','Taste druecken: Neustart']); if(nuremberg.isWon)modal(['URTEIL VOLLSTRECKT','Kapitel geschafft'])}
else {rect(W/2-1,0,2,H,C.x);rect(14,44,78,226,C.d);for(let x=24;x<88;x+=18)rect(x,58,6,190,C.x);rect(122,122,64,46,C.x);rect(128,128,52,34,C.m);rect(112,180,86,12,C.x);face(158,218,2);text('SCHICHT '+epstein.shiftsCompleted,14,26,10);text('GEFAHR '+Math.floor(epstein.danger)+'%',116,30,10);text('LOG '+fmt(epstein.logTimer),116,50,9);text('ENERGIE '+Math.floor(epstein.energy)+'%',116,306,9); if(epstein.isSleeping)text('Zzz',176,205,13,C.x); if(epstein.isSuspended)modal(['VOM DIENST SUSPENDIERT','Taste druecken: Neustart']); if(epstein.isFinished)modal(['EPSTEIN DIDN\'T','KILL HIMSELF'])}
if(popup)modal(popup); let n=new Date();$('clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
function modal(lines){rect(14,96,188,120,C.x);rect(18,100,180,112,C.l);rect(22,104,172,104,C.x);lines.forEach((l,i)=>text(l,108,128+i*20,i?9:11,C.l,'center'))}
load(); setChapter(chapter); function loop(){logic(1/30);draw();requestAnimationFrame(loop)} loop();
</script>
</body>
</html>
